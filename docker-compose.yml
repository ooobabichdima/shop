version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: strikeball_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - strikeball

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: strikeball_php
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=strikeball
      - DB_USERNAME=strikeball
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - strikeball

  mysql:
    image: mysql:8.0
    container_name: strikeball_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: strikeball
      MYSQL_USER: strikeball
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - strikeball

  redis:
    image: redis:alpine
    container_name: strikeball_redis
    ports:
      - "6379:6379"
    networks:
      - strikeball

networks:
  strikeball:
    driver: bridge

volumes:
  mysql_data:
